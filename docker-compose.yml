# Run everything:   docker compose up --build
# Stop:             docker compose down        (add -v to also wipe the database)
#
# Frontend  -> http://localhost:5173
# Backend   -> http://localhost:5017/swagger
# RabbitMQ  -> http://localhost:15672   (user/password from .env)

name: swiftdrop

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-swiftdrop}
      POSTGRES_USER: ${POSTGRES_USER:-swiftdrop}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_me_postgres}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infrastructure/postgres/init.sql:/docker-entrypoint-initdb.d/01-schemas.sql:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-swiftdrop}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-change_me_rabbit}
    volumes:
      - rabbitmqdata:/var/lib/rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 10s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: infrastructure/backend.Dockerfile
    image: swiftdrop-backend:latest
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Development}
      # Overrides appsettings.Development.json (which says Sqlite)
      Database__Provider: Postgres
      ConnectionStrings__Postgres: "Host=postgres;Port=5432;Database=${POSTGRES_DB:-swiftdrop};Username=${POSTGRES_USER:-swiftdrop};Password=${POSTGRES_PASSWORD:-change_me_postgres}"
      # RabbitMQ - the Messaging owner must read these names (or tell us theirs)
      RabbitMQ__Host: rabbitmq
      RabbitMQ__Port: "5672"
      RabbitMQ__Username: ${RABBITMQ_USER:-swiftdrop}
      RabbitMQ__Password: ${RABBITMQ_PASSWORD:-change_me_rabbit}
    volumes:
      - uploads:/app/uploads
    ports:
      - "${BACKEND_PORT:-5017}:8080"

  frontend:
    build:
      context: .
      dockerfile: infrastructure/frontend.Dockerfile
    image: swiftdrop-frontend:latest
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "${FRONTEND_PORT:-5173}:80"

volumes:
  pgdata:
  rabbitmqdata:
  uploads:
