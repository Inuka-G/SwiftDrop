apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: swiftdrop
spec:
  selector:
    app: backend
  ports:
    - port: 8080
      targetPort: 8080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: swiftdrop
spec:
  replicas: 1
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      containers:
        - name: backend
          image: swiftdrop-backend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef:
                name: swiftdrop-config
          env:
            # Order matters: $(VAR) can only use variables defined ABOVE it.
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef: { name: swiftdrop-secrets, key: POSTGRES_USER }
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef: { name: swiftdrop-secrets, key: POSTGRES_PASSWORD }
            - name: ConnectionStrings__Postgres
              value: "Host=postgres;Port=5432;Database=swiftdrop;Username=$(POSTGRES_USER);Password=$(POSTGRES_PASSWORD)"
            - name: RabbitMQ__Username
              valueFrom:
                secretKeyRef: { name: swiftdrop-secrets, key: RABBITMQ_USER }
            - name: RabbitMQ__Password
              valueFrom:
                secretKeyRef: { name: swiftdrop-secrets, key: RABBITMQ_PASSWORD }
          readinessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 20
          volumeMounts:
            - name: uploads
              mountPath: /app/uploads
      volumes:
        - name: uploads
          emptyDir: {}
