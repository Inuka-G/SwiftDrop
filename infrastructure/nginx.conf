# Serves the React build and forwards API / SignalR traffic to the backend.
# The hostname "backend" works in docker-compose AND in Kubernetes (Service name).

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # proof-of-delivery image uploads
    client_max_body_size 10m;

    # REST API (all endpoints are versioned under /api/v1)
    location /api/ {
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SignalR / WebSockets (live tracking). Confirm the hub path with the Realtime owner.
    location /hubs/ {
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_read_timeout 1h;
    }

    # Swagger UI + OpenAPI document
    location /swagger {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
    }
    location /openapi/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
    }

    # React single-page app: unknown paths fall back to index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
